name: Reporte diario de Telegram

on:
  schedule:
    # 00:00 UTC = 21:00 en Chile con horario de verano (UTC-3). Cuando Chile
    # vuelve a horario estándar (UTC-4, normalmente en abril) esto corre a
    # las 20:00 local hasta que se ajuste el cron a mano — GitHub Actions no
    # sigue zonas horarias con DST, solo UTC fijo.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar partidos y estadísticas de todas las ligas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python actualizar_todas_las_ligas.py

      - name: Enviar el reporte a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python enviar_telegram.py

      - name: Guardar apuestas.db actualizada en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apuestas.db
          git diff --cached --quiet || git commit -m "chore: actualizar datos diarios"
          git push
