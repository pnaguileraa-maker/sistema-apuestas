name: Reporte diario de Telegram (NBA)

on:
  schedule:
    # 22:00 UTC = 19:00 en Chile con horario de verano (UTC-3) = 17:00 ET
    # (UTC-5, invierno en EEUU) — coincide con el horario en que la NBA
    # publica oficialmente el injury report del día (5pm ET), así que
    # cuando se agregue esa fuente de datos el horario ya va a estar listo
    # para aprovecharla. Deja ~2h de margen antes de los partidos típicos
    # (7pm ET en adelante); los pocos que arrancan más temprano (domingos
    # ~13:00 ET / feriados) quedan sin aviso previo, aceptado a cambio de
    # tener la info de equipos/jugadores más fresca el resto de los días.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  enviar-reporte-nba:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # NBA usa API-Basketball (liga id 12), mismo API_FOOTBALL_KEY que el
      # fútbol (api-sports.io comparte una sola key por cuenta).
      - name: Actualizar partidos y equipos NBA
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python cargar_temporada_nba.py

      - name: Actualizar estadísticas de jugadores NBA
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python actualizar_estadisticas_jugadores_nba.py

      - name: Enviar el reporte NBA a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python enviar_telegram_basquet.py

      - name: Guardar apuestas.db actualizada en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apuestas.db
          git diff --cached --quiet || git commit -m "chore: actualizar datos NBA"
          git push
